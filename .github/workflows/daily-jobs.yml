name: Daily job digest

# Ticks every 30 minutes and lets the app decide whether to act.
#
# Vercel Cron would be the natural home, but Hobby accounts are capped at one run
# per day — a single fixed tick, which would make the send time chosen in the app
# a lie. GitHub Actions allows sub-daily schedules for free, so it pings the
# endpoint and /api/cron/daily-jobs decides: it sends only at the configured
# time, and only once per IST day. Vercel's own daily cron stays on as a late
# catch-up in case these runs are delayed or skipped.
#
# This job never fails the run. It is a heartbeat that fires ~48 times a day, so
# a red run means ~48 emails a day — which is exactly what happened when the
# CRON_SECRET secret was missing and the step exited 1. Alerting by failing a
# high-frequency scheduled job is the wrong mechanism: the real signal is the
# digest email arriving (or not), and the outcome of every tick is written to the
# job summary below, visible in the Actions tab without touching your inbox.

on:
  schedule:
    # Every 30 minutes, so half-past times (6:30 AM IST) are honoured too.
    - cron: "0,30 * * * *"
  workflow_dispatch: {} # lets you trigger a run by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily job search
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://email-blaster-orpin.vercel.app' }}
        run: |
          summary() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; echo "$1"; }

          if [ -z "$CRON_SECRET" ]; then
            summary "### Not configured"
            summary ""
            summary "The \`CRON_SECRET\` repository secret is not set, so this tick did nothing."
            summary "Add it under **Settings → Secrets and variables → Actions**, using the same"
            summary "value as the \`CRON_SECRET\` environment variable on Vercel."
            exit 0
          fi

          # --fail-with-body is not used: a non-2xx body carries the reason, and
          # we want to report it rather than let curl swallow it.
          body=$(curl -sS --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w $'\n%{http_code}' \
            "$APP_URL/api/cron/daily-jobs") || {
              summary "### Request failed"
              summary ""
              summary "Could not reach \`$APP_URL\`. Transient network or DNS problem, most likely."
              exit 0
            }

          code=$(printf '%s' "$body" | tail -n1)
          payload=$(printf '%s' "$body" | sed '$d')

          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            summary "### OK ($code)"
          else
            summary "### Unexpected response ($code)"
          fi
          summary ""
          summary '```json'
          summary "$payload"
          summary '```'

          # Always green. See the note at the top of this file — a scheduled job
          # that runs 48 times a day must not use run failure as its alerting
          # channel.
          exit 0
